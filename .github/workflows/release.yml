name: Release

# Publishes the `privyl` package to npm when a GitHub release is published.
# Uses npm Trusted Publishing (OIDC): no npm token is stored in this repository.
# npm checks that the package comes from this repository and this workflow, and adds a
# provenance statement to the package page.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow (Trusted Publishing + provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to check that the tag is on main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache here: a cache could carry files from another run into the
          # package that gets published. A clean install is slower but safer.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The release tag (v0.2.0) must match the version in package.json (0.2.0).
      - name: Check tag and version
        run: |
          version=$(node -p "require('./packages/privyl/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      # Only code that went through a pull request into main gets published.
      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release tag points to a commit that is not on main"
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm --filter privyl build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Publish to npm
        working-directory: packages/privyl
        run: npm publish --access public
